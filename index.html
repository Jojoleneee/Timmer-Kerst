<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎄 Familie Verlanglijstjes</title>

<style>
:root{
    --green:#184d47;
    --red:#9b2226;
}

body{
    margin:0;
    font-family:Segoe UI,Arial,sans-serif;
    background:#f5f5f5;
}

header{
    background:var(--green);
    color:white;
    text-align:center;
    padding:20px;
}

.topbar{
    padding:15px;
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:10px;
}

.search{
    padding:10px;
    width:250px;
}

.tabs{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:10px;
    margin:15px;
}

.tab{
    border:none;
    padding:10px 16px;
    border-radius:8px;
    cursor:pointer;
    background:white;
}

.tab.active{
    background:var(--red);
    color:white;
}

.content{
    max-width:1000px;
    margin:auto;
    padding:20px;
}

.card{
    background:white;
    margin-bottom:15px;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 2px 6px rgba(0,0,0,.15);
}

.card-header{
    padding:15px;
    cursor:pointer;
    display:flex;
    justify-content:space-between;
    font-weight:bold;
}

.card-body{
    display:none;
    padding:15px;
    border-top:1px solid #eee;
}

.card img{
    width:100%;
    max-height:350px;
    object-fit:contain;
}

.add-btn{
    background:var(--green);
    color:white;
    border:none;
    border-radius:8px;
    padding:12px 16px;
    cursor:pointer;
}

.delete-btn{
    background:var(--red);
    color:white;
    border:none;
    border-radius:8px;
    padding:10px;
    cursor:pointer;
    margin-left:5px;
}

.edit-btn{
    background:#2563eb;
    color:white;
    border:none;
    border-radius:8px;
    padding:10px;
    cursor:pointer;
}

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.5);
    justify-content:center;
    align-items:center;
}

.modal-content{
    background:white;
    width:500px;
    max-width:90%;
    padding:20px;
    border-radius:12px;
}

input, textarea, select{
    width:100%;
    margin-bottom:10px;
    padding:10px;
    box-sizing:border-box;
}

a{
    color:#0a66c2;
}
</style>
</head>
<body>

<header>
<h1>🎄 Familie Verlanglijstjes 🎄</h1>
</header>

<div class="topbar">

<input
id="search"
class="search"
placeholder="🔍 Zoek cadeau..."
oninput="render()">

<label>
<input
type="checkbox"
id="surprise"
onchange="render()">
🎅 Verrassingsmodus
</label>

<button class="add-btn" onclick="openModal()">
➕ Nieuwe wens
</button>

</div>

<div id="tabs" class="tabs"></div>
<div id="content" class="content"></div>

<div id="modal" class="modal">

<div class="modal-content">

<h2 id="modalTitle">Nieuwe wens</h2>

<select id="personSelect"></select>

<input id="title" placeholder="Cadeau">

<input id="link" placeholder="Productlink">

<input id="image" placeholder="Afbeeldingslink">

<input id="price" placeholder="Richtprijs (€)">

<select id="priority">
<option value="5">⭐⭐⭐⭐⭐</option>
<option value="4">⭐⭐⭐⭐</option>
<option value="3">⭐⭐⭐</option>
<option value="2">⭐⭐</option>
<option value="1">⭐</option>
</select>

<textarea
id="notes"
placeholder="Opmerking"></textarea>

<button
class="add-btn"
onclick="saveGift()">

Opslaan

</button>

<button onclick="closeModal()">
Annuleren
</button>

</div>

</div>

<script type="module">

import {
initializeApp
}
from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";

import {
getFirestore,
collection,
addDoc,
deleteDoc,
doc,
updateDoc,
query,
orderBy,
onSnapshot
}
from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

const firebaseConfig = {

apiKey: "AIzaSyABxYQSoVHiXKK-X5qr3KFGUJJEYw9Ws6s",
authDomain: "timmer-kerst.firebaseapp.com",
projectId: "timmer-kerst",
storageBucket: "timmer-kerst.firebasestorage.app",
messagingSenderId: "211240960325",
appId: "1:211240960325:web:e36c16d53740e562f53e2c",
measurementId: "G-QQEY03K7RJ"

};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const people = [
"Jolijn",
"Gerrit",
"Anette",
"Marieke",
"Rene",
"Lilli",
"Nijs"
];

let gifts = [];
let activeTab = "Jolijn";
let editingId = null;

function clearForm(){

document.getElementById("title").value = "";
document.getElementById("link").value = "";
document.getElementById("image").value = "";
document.getElementById("price").value = "";
document.getElementById("notes").value = "";
document.getElementById("priority").value = "5";

}

window.openModal = function(){

editingId = null;

document.getElementById("modalTitle").innerText =
"Nieuwe wens";

clearForm();

const select =
document.getElementById("personSelect");

select.innerHTML = "";

people.forEach(person=>{
select.innerHTML +=
`<option>${person}</option>`;
});

document.getElementById("modal").style.display =
"flex";

}

window.closeModal = function(){

document.getElementById("modal").style.display =
"none";

}

window.editGift = function(id){

const gift =
gifts.find(g=>g.id===id);

if(!gift) return;

editingId = id;

document.getElementById("modalTitle").innerText =
"Wens bewerken";

const select =
document.getElementById("personSelect");

select.innerHTML = "";

people.forEach(person=>{
select.innerHTML +=
`<option>${person}</option>`;
});

document.getElementById("personSelect").value =
gift.person;

document.getElementById("title").value =
gift.title || "";

document.getElementById("link").value =
gift.link || "";

document.getElementById("image").value =
gift.image || "";

document.getElementById("price").value =
gift.price || "";

document.getElementById("notes").value =
gift.notes || "";

document.getElementById("priority").value =
gift.priority || 5;

document.getElementById("modal").style.display =
"flex";

}

window.saveGift = async function(){

const title =
document.getElementById("title").value.trim();

if(!title){

alert("Vul een cadeau in");
return;

}

const giftData = {

person:
document.getElementById("personSelect").value,

title,

link:
document.getElementById("link").value,

image:
document.getElementById("image").value,

price:
document.getElementById("price").value,

priority:
parseInt(
document.getElementById("priority").value
),

notes:
document.getElementById("notes").value

};

if(editingId){

await updateDoc(
doc(db,"wishes",editingId),
giftData
);

}else{

await addDoc(
collection(db,"wishes"),
{
...giftData,
created: Date.now()
}
);

}

clearForm();

editingId = null;

closeModal();

}

window.deleteGift = async function(id){

if(confirm("Wens verwijderen?")){

await deleteDoc(
doc(db,"wishes",id)
);

}

}

window.changeTab = function(person){

activeTab = person;

render();

}

window.toggleCard = function(id){

const card =
document.getElementById(id);

card.style.display =
card.style.display === "block"
? "none"
: "block";

}

function renderTabs(){

const tabs =
document.getElementById("tabs");

tabs.innerHTML = "";

people.forEach(person=>{

const count =
gifts.filter(
g=>g.person===person
).length;

tabs.innerHTML += `
<button
class="tab ${person===activeTab?'active':''}"
onclick="changeTab('${person}')">

${person} (${count})

</button>
`;

});

}

function render(){

renderTabs();

const search =
document.getElementById("search")
.value
.toLowerCase();

const surprise =
document.getElementById("surprise")
.checked;

const content =
document.getElementById("content");

content.innerHTML = "";

const filtered =
gifts
.filter(g=>g.person===activeTab)
.filter(g=>
g.title.toLowerCase()
.includes(search)
)
.sort(
(a,b)=>
b.priority-a.priority
);

filtered.forEach((gift,index)=>{

content.innerHTML += `

<div class="card">

<div
class="card-header"
onclick="toggleCard('card${index}')">

<div>
${"⭐".repeat(gift.priority)}
${surprise ? " 🎁 Cadeau" : " " + gift.title}
</div>

<div>▼</div>

</div>

<div
class="card-body"
id="card${index}">

${gift.image ?
`<img src="${gift.image}">`
: ""}

${!surprise ? `
<p><strong>💰</strong>
${gift.price || "-"}</p>

<p>${gift.notes || ""}</p>

${gift.link ?
`<a href="${gift.link}"
target="_blank">
Bekijk cadeau
</a>`
: ""}
`
: ""}

<br><br>

<button
class="edit-btn"
onclick="editGift('${gift.id}')">

✏️ Bewerken

</button>

<button
class="delete-btn"
onclick="deleteGift('${gift.id}')">

🗑️ Verwijderen

</button>

</div>

</div>

`;

});

}

const q =
query(
collection(db,"wishes"),
orderBy("priority","desc")
);

onSnapshot(q,(snapshot)=>{

gifts =
snapshot.docs.map(doc=>({
id: doc.id,
...doc.data()
}));

render();

});

</script>

</body>
</html>
